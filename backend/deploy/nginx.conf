# Ejemplo para el VPS: un server por dominio de tienda (o un server_name con varios).
# El front (Angular SSR) corre en :4000 y el API Gateway en :3000.
# El gateway identifica el comercio por el Host, así que hay que reenviarlo.
server {
    listen 80;
    server_name malaika.com.ar www.malaika.com.ar;

    # Certificados: certbot --nginx -d malaika.com.ar -d www.malaika.com.ar

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
